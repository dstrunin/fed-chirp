name: local-scan-note

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  note:
    runs-on: ubuntu-latest
    steps:
      - name: Explain local-only scoring
        run: |
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          # Fed Chirp scans now run locally

          Scheduled scoring uses the local Hermes CLI with Codex OAuth, so it
          must run on the Mac where Hermes is authenticated. This GitHub
          workflow is intentionally manual-only and does not run scans because
          GitHub Actions cannot access that local OAuth session.
          EOF
